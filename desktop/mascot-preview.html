<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyra mascot preview</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
      body { margin: 0; background: #14161b; color: #e8eaf0; display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
      #stage { position: relative; display: flex; gap: 40px; align-items: flex-end; justify-content: center; padding: 0 20px 80px; background: #20232b; }
      #stage[data-bg="light"] { background: #f2f3f5; }
      #stage[data-bg="wall"] { background: linear-gradient(135deg, #ff9966, #6a82fb 55%, #1fa2a2); }
      #stage[data-bg="check"] { background: repeating-conic-gradient(#555 0 25%, #bbb 0 50%) 0 0 / 40px 40px; }
      #stage .slot { width: 240px; height: 240px; }
      #stage .slot .lyra-char { width: 240px; height: 240px; }
      #panel { padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #181b21; font-size: 13px; }
      h1 { font-size: 15px; margin: 0; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button, select { background: #2a2f39; color: inherit; border: 1px solid #3a4150; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
      button.on { background: #9ff2da; color: #0d2a24; border-color: #9ff2da; }
      label { display: flex; flex-direction: column; gap: 4px; }
      input[type="range"] { width: 100%; }
      #pad { width: 120px; height: 120px; border-radius: 12px; background: #20242d; border: 1px solid #3a4150; position: relative; touch-action: none; cursor: crosshair; }
      #dot { position: absolute; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: #9ff2da; left: 50%; top: 50%; pointer-events: none; }
      #fps { font-variant-numeric: tabular-nums; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="stage" data-bg="dark"></div>
    <div id="panel">
      <h1>Lyra mascot preview</h1>
      <div class="row" id="emotes"></div>
      <label>Mouth <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>Motion (px/s) <input id="motion" type="range" min="0" max="500" step="5" value="0" /></label>
      <div class="row"><button id="music">Music: off</button></div>
      <div class="row"><button id="faceL">Face left</button><button id="faceR" class="on">Face right</button></div>
      <div>Look pad<div id="pad"><div id="dot"></div></div></div>
      <label>Background
        <select id="bg"><option value="dark">Dark</option><option value="light">Light</option><option value="wall">Wallpaper</option><option value="check">Checker</option></select>
      </label>
      <label style="flex-direction:row;align-items:center;gap:8px"><input id="two" type="checkbox" /> Two characters</label>
      <div id="fps">fps: …</div>
    </div>
    <script type="module" src="/src/windows/mascot/preview.ts"></script>
  </body>
</html>
